<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 820" role="img">
<style>
  svg text {
    font-family: var(--font-sans, sans-serif);
  }
</style>

    <title>Activity Diagram 1 — Daily tea leaf collection</title>
    <desc>Shows the flow from route start through QR scan, weight entry, offline save, and route completion.</desc>
    <defs>
      <marker id="arr0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </marker>
    </defs>

    <!-- Swimlane backgrounds -->
    <rect x="10" y="30" width="200" height="760" rx="8" fill="#1D9E75" fill-opacity=".07" stroke="#1D9E75"
      stroke-opacity=".25" stroke-width="0.5" />
    <rect x="220" y="30" width="220" height="760" rx="8" fill="#185FA5" fill-opacity=".06" stroke="#185FA5"
      stroke-opacity=".2" stroke-width="0.5" />
    <rect x="450" y="30" width="220" height="760" rx="8" fill="#534AB7" fill-opacity=".05" stroke="#534AB7"
      stroke-opacity=".2" stroke-width="0.5" />

    <!-- Swimlane headers -->
    <text x="110" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#085041"
      font-family="var(--font-sans,sans-serif)">Collector</text>
    <text x="330" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C"
      font-family="var(--font-sans,sans-serif)">Mobile App</text>
    <text x="560" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489"
      font-family="var(--font-sans,sans-serif)">Local Database</text>

    <!-- START -->
    <circle cx="110" cy="90" r="12" fill="#444441" />
    <line x1="110" y1="102" x2="110" y2="128" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 1. Start daily route -->
    <g>
      <rect x="30" y="130" width="160" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
        stroke-opacity=".6" stroke-width="0.5" />
      <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="500" fill="#085041"
        font-family="var(--font-sans,sans-serif)">Start daily route</text>
      <text x="110" y="163" text-anchor="middle" font-size="11" fill="#0F6E56"
        font-family="var(--font-sans,sans-serif)">Load route list</text>
    </g>
    <line x1="110" y1="174" x2="110" y2="198" stroke="#888780" stroke-width="1.2" />
    <line x1="110" y1="198" x2="240" y2="198" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 2. App loads farmer list -->
    <g>
      <rect x="240" y="176" width="180" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
        stroke-opacity=".5" stroke-width="0.5" />
      <text x="330" y="194" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C"
        font-family="var(--font-sans,sans-serif)">Load farmer list</text>
      <text x="330" y="209" text-anchor="middle" font-size="11" fill="#185FA5"
        font-family="var(--font-sans,sans-serif)">From local DB</text>
    </g>
    <line x1="330" y1="220" x2="330" y2="266" stroke="#888780" stroke-width="1.2" />

    <!-- 3. Collector arrives at farm -->
    <line x1="330" y1="266" x2="190" y2="266" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />
    <g>
      <rect x="30" y="244" width="160" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
        stroke-opacity=".6" stroke-width="0.5" />
      <text x="110" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#085041"
        font-family="var(--font-sans,sans-serif)">Arrive at supplier</text>
      <text x="110" y="277" text-anchor="middle" font-size="11" fill="#0F6E56"
        font-family="var(--font-sans,sans-serif)">Scan farmer QR code</text>
    </g>
    <line x1="110" y1="288" x2="110" y2="340" stroke="#888780" stroke-width="1.2" />
    <line x1="110" y1="340" x2="254" y2="340" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 4. Validate QR -->
    <polygon points="330,310 406,340 330,370 254,340" fill="#EF9F27" fill-opacity=".2" stroke="#BA7517"
      stroke-width="0.8" />
    <text x="330" y="337" text-anchor="middle" font-size="12" font-weight="500" fill="#633806"
      font-family="var(--font-sans,sans-serif)">QR valid?</text>
    <text x="330" y="352" text-anchor="middle" font-size="10" fill="#854F0B"
      font-family="var(--font-sans,sans-serif)">Farmer found in DB</text>

    <!-- No branch -->
    <line x1="406" y1="340" x2="420" y2="340" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />
    <text x="400" y="334" text-anchor="middle" font-size="10" fill="#888780"
      font-family="var(--font-sans,sans-serif)">No</text>
    <rect x="420" y="320" width="130" height="40" rx="6" fill="#E24B4A" fill-opacity=".12" stroke="#A32D2D"
      stroke-opacity=".5" stroke-width="0.5" />
    <text x="485" y="336" text-anchor="middle" font-size="11" font-weight="500" fill="#791F1F"
      font-family="var(--font-sans,sans-serif)">Rescan / Manual Search</text>
    <text x="485" y="350" text-anchor="middle" font-size="10" fill="#A32D2D"
      font-family="var(--font-sans,sans-serif)">Find by Farmer ID</text>
    <line x1="485" y1="360" x2="485" y2="380" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="485" y1="380" x2="330" y2="380" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="330" y1="380" x2="330" y2="370" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"
      marker-end="url(#arr0)" />

    <!-- Yes branch -->
    <text x="345" y="385" text-anchor="middle" font-size="10" fill="#888780"
      font-family="var(--font-sans,sans-serif)">Yes</text>
    <line x1="330" y1="370" x2="330" y2="400" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 5. Display farmer profile -->
    <g>
      <rect x="240" y="402" width="180" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
        stroke-opacity=".5" stroke-width="0.5" />
      <text x="330" y="420" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C"
        font-family="var(--font-sans,sans-serif)">Show farmer profile</text>
    </g>
    <line x1="330" y1="446" x2="330" y2="468" stroke="#888780" stroke-width="1.2" />
    <line x1="330" y1="468" x2="190" y2="468" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 6. Enter weight -->
    <g>
      <rect x="30" y="446" width="160" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
        stroke-opacity=".6" stroke-width="0.5" />
      <text x="110" y="464" text-anchor="middle" font-size="13" font-weight="500" fill="#085041"
        font-family="var(--font-sans,sans-serif)">Enter leaf weight</text>
      <text x="110" y="479" text-anchor="middle" font-size="11" fill="#0F6E56"
        font-family="var(--font-sans,sans-serif)">Type kg amount</text>
    </g>
    <line x1="110" y1="490" x2="110" y2="540" stroke="#888780" stroke-width="1.2" />
    <line x1="110" y1="540" x2="254" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 7. Validate weight -->
    <polygon points="330,510 406,540 330,570 254,540" fill="#EF9F27" fill-opacity=".2" stroke="#BA7517"
      stroke-width="0.8" />
    <text x="330" y="537" text-anchor="middle" font-size="12" font-weight="500" fill="#633806"
      font-family="var(--font-sans,sans-serif)">Weight > 0?</text>
    <text x="330" y="552" text-anchor="middle" font-size="10" fill="#854F0B"
      font-family="var(--font-sans,sans-serif)">Basic validation</text>

    <!-- No -->
    <line x1="406" y1="540" x2="436" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />
    <text x="406" y="534" text-anchor="middle" font-size="10" fill="#888780"
      font-family="var(--font-sans,sans-serif)">No</text>
    <rect x="436" y="520" width="110" height="40" rx="6" fill="#E24B4A" fill-opacity=".1" stroke="#A32D2D"
      stroke-opacity=".5" stroke-width="0.5" />
    <text x="491" y="536" text-anchor="middle" font-size="11" font-weight="500" fill="#791F1F"
      font-family="var(--font-sans,sans-serif)">Validation error</text>
    <text x="491" y="550" text-anchor="middle" font-size="10" fill="#A32D2D"
      font-family="var(--font-sans,sans-serif)">Prompt re-entry</text>
    <line x1="491" y1="560" x2="491" y2="580" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="491" y1="580" x2="330" y2="580" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="330" y1="580" x2="330" y2="570" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"
      marker-end="url(#arr0)" />

    <!-- Yes -->
    <text x="345" y="585" text-anchor="middle" font-size="10" fill="#888780"
      font-family="var(--font-sans,sans-serif)">Yes</text>
    <line x1="330" y1="570" x2="330" y2="600" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 8. Save offline -->
    <g>
      <rect x="240" y="602" width="180" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
        stroke-opacity=".5" stroke-width="0.5" />
      <text x="330" y="620" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C"
        font-family="var(--font-sans,sans-serif)">Save record offline</text>
      <text x="330" y="635" text-anchor="middle" font-size="11" fill="#185FA5"
        font-family="var(--font-sans,sans-serif)">Farmer, weight, time</text>
    </g>
    <line x1="330" y1="646" x2="330" y2="668" stroke="#888780" stroke-width="1.2" />
    <line x1="330" y1="668" x2="474" y2="668" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 9. Write to mobile DB -->
    <g>
      <rect x="474" y="646" width="172" height="44" rx="8" fill="#534AB7" fill-opacity=".12" stroke="#534AB7"
        stroke-opacity=".4" stroke-width="0.5" />
      <text x="560" y="664" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C"
        font-family="var(--font-sans,sans-serif)">Write to mobile DB</text>
      <text x="560" y="679" text-anchor="middle" font-size="11" fill="#3C3489"
        font-family="var(--font-sans,sans-serif)">Pending sync flag</text>
    </g>
    <line x1="560" y1="690" x2="560" y2="730" stroke="#888780" stroke-width="1.2" />
    <line x1="560" y1="730" x2="190" y2="730" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- 10. More farmers? -->
    <polygon points="110,700 190,730 110,760 30,730" fill="#EF9F27" fill-opacity=".2" stroke="#BA7517"
      stroke-width="0.8" />
    <text x="110" y="727" text-anchor="middle" font-size="12" font-weight="500" fill="#633806"
      font-family="var(--font-sans,sans-serif)">More suppliers?</text>
    <text x="110" y="742" text-anchor="middle" font-size="10" fill="#854F0B"
      font-family="var(--font-sans,sans-serif)">On today's route</text>

    <!-- Yes loop back -->
    <line x1="30" y1="730" x2="20" y2="730" stroke="#888780" stroke-width="1.2" />
    <text x="32" y="724" font-size="10" fill="#888780" font-family="var(--font-sans,sans-serif)">Yes</text>
    <line x1="20" y1="730" x2="20" y2="266" stroke="#888780" stroke-width="1.2" />
    <line x1="20" y1="266" x2="30" y2="266" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- No -->
    <text x="148" y="790" text-anchor="middle" font-size="10" fill="#888780"
      font-family="var(--font-sans,sans-serif)">No — route done</text>
    <line x1="110" y1="760" x2="110" y2="800" stroke="#888780" stroke-width="1.2" marker-end="url(#arr0)" />

    <!-- END -->
    <circle cx="110" cy="808" r="8" fill="#444441" />
    <circle cx="110" cy="808" r="12" fill="none" stroke="#444441" stroke-width="2" />
  </svg>