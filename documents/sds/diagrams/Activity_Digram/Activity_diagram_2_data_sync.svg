<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 740" role="img">
<style>
  svg text {
    font-family: var(--font-sans, sans-serif);
  }
</style>

    <title>Activity Diagram 2 — Data synchronisation (local and cloud)</title>
    <desc>Shows how the collector chooses between local LAN sync and cloud sync, and the steps taken in each path.
    </desc>
    <defs>
      <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </marker>
    </defs>

    <!-- Swimlane backgrounds -->
    <rect x="10" y="30" width="155" height="690" rx="8" fill="#1D9E75" fill-opacity=".07" stroke="#1D9E75"
      stroke-opacity=".25" stroke-width="0.5" />
    <rect x="175" y="30" width="155" height="690" rx="8" fill="#185FA5" fill-opacity=".06" stroke="#185FA5"
      stroke-opacity=".2" stroke-width="0.5" />
    <rect x="340" y="30" width="155" height="690" rx="8" fill="#534AB7" fill-opacity=".05" stroke="#534AB7"
      stroke-opacity=".2" stroke-width="0.5" />
    <rect x="505" y="30" width="165" height="690" rx="8" fill="#3B6D11" fill-opacity=".05" stroke="#3B6D11"
      stroke-opacity=".2" stroke-width="0.5" />

    <text x="87" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#085041"
      font-family="var(--font-sans,sans-serif)">Collector</text>
    <text x="252" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C"
      font-family="var(--font-sans,sans-serif)">Mobile App</text>
    <text x="417" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489"
      font-family="var(--font-sans,sans-serif)">Office Desktop</text>
    <text x="587" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A"
      font-family="var(--font-sans,sans-serif)">Cloud / API</text>

    <!-- START -->
    <circle cx="87" cy="90" r="12" fill="#444441" />
    <line x1="87" y1="102" x2="87" y2="128" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <!-- Trigger sync -->
    <rect x="22" y="130" width="130" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
      stroke-opacity=".6" stroke-width="0.5" />
    <text x="87" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#085041"
      font-family="var(--font-sans,sans-serif)">Trigger sync</text>
    <text x="87" y="163" text-anchor="middle" font-size="10" fill="#0F6E56"
      font-family="var(--font-sans,sans-serif)">End of route</text>
    <line x1="87" y1="174" x2="87" y2="198" stroke="#888780" stroke-width="1.2" />
    <line x1="87" y1="198" x2="185" y2="198" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <!-- Check pending -->
    <rect x="185" y="176" width="130" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
      stroke-opacity=".5" stroke-width="0.5" />
    <text x="250" y="194" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C"
      font-family="var(--font-sans,sans-serif)">Check pending</text>
    <text x="250" y="209" text-anchor="middle" font-size="10" fill="#185FA5"
      font-family="var(--font-sans,sans-serif)">Records in local DB</text>
    <line x1="250" y1="220" x2="250" y2="252" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <!-- Sync mode decision -->
    <polygon points="250,252 338,282 250,312 162,282" fill="#EF9F27" fill-opacity=".2" stroke="#BA7517"
      stroke-width="0.8" />
    <text x="250" y="279" text-anchor="middle" font-size="12" font-weight="500" fill="#633806"
      font-family="var(--font-sans,sans-serif)">Internet available?</text>
    <text x="250" y="294" text-anchor="middle" font-size="10" fill="#854F0B"
      font-family="var(--font-sans,sans-serif)">Auto connectivity check</text>

    <!-- LOCAL branch (left) -->
    <text x="124" y="278" font-size="10" fill="#888780" font-family="var(--font-sans,sans-serif)">No</text>
    <text x="124" y="294" font-size="10" fill="#888780" font-family="var(--font-sans,sans-serif)">Local LAN</text>
    <line x1="162" y1="282" x2="87" y2="282" stroke="#888780" stroke-width="1.2" />
    <line x1="87" y1="282" x2="87" y2="316" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <rect x="22" y="318" width="130" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
      stroke-opacity=".6" stroke-width="0.5" />
    <text x="87" y="336" text-anchor="middle" font-size="12" font-weight="500" fill="#085041"
      font-family="var(--font-sans,sans-serif)">Connect via LAN</text>
    <text x="87" y="351" text-anchor="middle" font-size="10" fill="#0F6E56"
      font-family="var(--font-sans,sans-serif)">Wi-Fi / hotspot</text>
    <line x1="87" y1="362" x2="87" y2="386" stroke="#888780" stroke-width="1.2" />
    <line x1="87" y1="386" x2="185" y2="386" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <rect x="185" y="364" width="130" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
      stroke-opacity=".5" stroke-width="0.5" />
    <text x="250" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C"
      font-family="var(--font-sans,sans-serif)">Transfer to office</text>
    <text x="250" y="397" text-anchor="middle" font-size="10" fill="#185FA5"
      font-family="var(--font-sans,sans-serif)">Push over network</text>
    <line x1="250" y1="408" x2="250" y2="432" stroke="#888780" stroke-width="1.2" />
    <line x1="250" y1="432" x2="350" y2="432" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <rect x="350" y="410" width="130" height="44" rx="8" fill="#534AB7" fill-opacity=".12" stroke="#534AB7"
      stroke-opacity=".4" stroke-width="0.5" />
    <text x="415" y="428" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C"
      font-family="var(--font-sans,sans-serif)">Write to office DB</text>
    <text x="415" y="443" text-anchor="middle" font-size="10" fill="#3C3489"
      font-family="var(--font-sans,sans-serif)">Merge records</text>

    <!-- Office DB syncs with Cloud -->
    <line x1="415" y1="454" x2="415" y2="486" stroke="#888780" stroke-width="1.2" />

    <rect x="350" y="486" width="130" height="44" rx="8" fill="#534AB7" fill-opacity=".12" stroke="#534AB7"
      stroke-opacity=".4" stroke-width="0.5" />
    <text x="415" y="504" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C"
      font-family="var(--font-sans,sans-serif)">Sync to Cloud DB</text>
    <text x="415" y="519" text-anchor="middle" font-size="10" fill="#3C3489"
      font-family="var(--font-sans,sans-serif)">Background update</text>

    <!-- Arrow to Cloud DB -->
    <line x1="480" y1="508" x2="515" y2="508" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3"
      marker-end="url(#arr1)" />

    <rect x="515" y="486" width="140" height="44" rx="8" fill="#3B6D11" fill-opacity=".12" stroke="#3B6D11"
      stroke-opacity=".4" stroke-width="0.5" />
    <text x="585" y="504" text-anchor="middle" font-size="12" font-weight="500" fill="#173404"
      font-family="var(--font-sans,sans-serif)">Update Cloud DB</text>
    <text x="585" y="519" text-anchor="middle" font-size="10" fill="#27500A"
      font-family="var(--font-sans,sans-serif)">Mirror office records</text>

    <!-- Continue to success join -->
    <line x1="415" y1="530" x2="415" y2="584" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" />

    <!-- CLOUD branch (right) -->
    <text x="376" y="278" font-size="10" fill="#888780" font-family="var(--font-sans,sans-serif)">Yes</text>
    <text x="376" y="294" font-size="10" fill="#888780" font-family="var(--font-sans,sans-serif)">Cloud</text>
    <line x1="338" y1="282" x2="585" y2="282" stroke="#888780" stroke-width="1.2" />
    <line x1="585" y1="282" x2="585" y2="364" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <rect x="515" y="364" width="140" height="44" rx="8" fill="#3B6D11" fill-opacity=".12" stroke="#3B6D11"
      stroke-opacity=".4" stroke-width="0.5" />
    <text x="585" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#173404"
      font-family="var(--font-sans,sans-serif)">Store in cloud DB</text>
    <text x="585" y="397" text-anchor="middle" font-size="10" fill="#27500A"
      font-family="var(--font-sans,sans-serif)">App uploads directly</text>

    <!-- Cloud merges into Office DB -->
    <line x1="585" y1="408" x2="585" y2="432" stroke="#888780" stroke-width="1.2" />
    <line x1="585" y1="432" x2="480" y2="432" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <!-- Mark as synced -->
    <line x1="415" y1="584" x2="315" y2="584" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />
    <rect x="185" y="562" width="130" height="44" rx="8" fill="#185FA5" fill-opacity=".12" stroke="#185FA5"
      stroke-opacity=".5" stroke-width="0.5" />
    <text x="250" y="580" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C"
      font-family="var(--font-sans,sans-serif)">Mark as synced</text>
    <text x="250" y="595" text-anchor="middle" font-size="10" fill="#185FA5"
      font-family="var(--font-sans,sans-serif)">Clear pending flag</text>
    <line x1="250" y1="606" x2="250" y2="630" stroke="#888780" stroke-width="1.2" />
    <line x1="250" y1="630" x2="152" y2="630" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <rect x="22" y="608" width="130" height="44" rx="8" fill="#1D9E75" fill-opacity=".15" stroke="#1D9E75"
      stroke-opacity=".6" stroke-width="0.5" />
    <text x="87" y="626" text-anchor="middle" font-size="12" font-weight="500" fill="#085041"
      font-family="var(--font-sans,sans-serif)">Notify collector</text>
    <text x="87" y="641" text-anchor="middle" font-size="10" fill="#0F6E56"
      font-family="var(--font-sans,sans-serif)">Sync complete</text>
    <line x1="87" y1="652" x2="87" y2="680" stroke="#888780" stroke-width="1.2" marker-end="url(#arr1)" />

    <!-- END -->
    <circle cx="87" cy="688" r="8" fill="#444441" />
    <circle cx="87" cy="688" r="12" fill="none" stroke="#444441" stroke-width="2" />
  </svg>